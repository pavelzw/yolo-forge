context:
  version: 1.2.1

package:
  name: yap-repackaged
  version: ${{ version }}

source:
  - url: https://github.com/finnvoor/yap/releases/download/${{ version }}/yap-${{ version }}.tar.gz
    sha256: 5d7cef0c5d5de12902ac3d14d555ac8f6090812bedb57ccfd270829d8dc23e70
  - url: https://raw.githubusercontent.com/finnvoor/yap/refs/tags/${{ version }}/LICENSE
    sha256: 7179683e8000e6bdc9bbc60d85edf0a4ac8e76f951857f54fcb775d5886f1309

build:
  number: 1
  skip: target_platform != 'osx-arm64'
  script:
    - mkdir -p $PREFIX/bin
    - cp yap $PREFIX/bin/yap

requirements:
  run:
    - __osx >=26

tests:
  - package_contents:
      bin:
        - yap
      strict: true
  # runners don't support macOS >=26 yet
  # - script: yap --version

about:
  summary: 🗣️ A CLI for on-device speech transcription using Speech.framework on macOS 26
  homepage: https://github.com/finnvoor/yap
  repository: https://github.com/finnvoor/yap
  license: CC0-1.0
  documentation: https://github.com/finnvoor/yap
  license_file: LICENSE
