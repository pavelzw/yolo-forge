build:
  number: 0
  script:
    - if: win
      then:
        - mkdir %LIBRARY_BIN%
        - for %%f in (bricks brickscompile bricksconvert bricksdesigner bricksload brickspw idcams) do copy %%f.exe %LIBRARY_BIN%\%%f.exe
      else:
        - mkdir -p $PREFIX/bin
        - |
          for f in bricks brickscompile bricksconvert bricksdesigner bricksload brickspw idcams; do
            cp "$f" "$PREFIX/bin/$f"
            chmod +x "$PREFIX/bin/$f"
          done

tests:
  - package_contents:
      bin:
        - bricks
        - brickscompile
        - bricksconvert
        - bricksdesigner
        - bricksload
        - brickspw
        - idcams
      strict: true
  - script:
      - bricks --help
      - brickscompile --help
      - idcams --help

about:
  summary: A CICS compatible transaction server
  homepage: https://github.com/moshix/BRICKS_TS
  repository: https://github.com/moshix/BRICKS_TS
