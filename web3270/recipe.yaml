context:
  version: 4.3.0
  # the release binaries carry a four-part build version
  build_version: 4.3.1.5

package:
  name: web3270
  version: ${{ version }}

source:
  - if: linux and x86_64
    then:
      url: https://github.com/moshix/web3270/releases/download/${{ version }}/web3270-${{ build_version }}-linux-amd64
      file_name: web3270
      sha256: b80777e85409ad5a2aa47e7438191d7bc35be36b29021415590d8c7e49cf053b
  - if: linux and aarch64
    then:
      url: https://github.com/moshix/web3270/releases/download/${{ version }}/web3270-${{ build_version }}-linux-arm64
      file_name: web3270
      sha256: 8791de1f11425a226fbc28425e10bb301a687abe2d690339c3aaff786a6068e4
  - if: osx and arm64
    then:
      url: https://github.com/moshix/web3270/releases/download/${{ version }}/web3270-${{ build_version }}-darwin-arm64
      file_name: web3270
      sha256: 88f8fee79e8c1f2c54fac885daa115f91f1692c4b834776ada4ad97f8c879d2c
  - if: win
    then:
      url: https://github.com/moshix/web3270/releases/download/${{ version }}/web3270-${{ build_version }}-windows-amd64.exe
      file_name: web3270.exe
      sha256: 83bb9d897a8af8af85efeda5c0d89c179d624d31865d3f374666ea6500289407
  - url: https://raw.githubusercontent.com/moshix/web3270/refs/tags/${{ version }}/LICENSE
    sha256: 2b2771a3f3eb13fcca951a12b163918921310b0294323c9af3b157de82fe877d

build:
  number: 1
  script:
    - if: win
      then:
        - mkdir %LIBRARY_BIN%
        - copy web3270.exe %LIBRARY_BIN%\web3270.exe
      else:
        - mkdir -p $PREFIX/bin
        - cp web3270 $PREFIX/bin/web3270
        - chmod +x $PREFIX/bin/web3270

tests:
  - package_contents:
      bin:
        - web3270
      strict: true
  - script: web3270 --help

about:
  summary: A lightweight, easy to use, and free 3270 terminal emulator in the browser
  homepage: https://github.com/moshix/web3270
  repository: https://github.com/moshix/web3270
  license: LicenseRef-Moshix-Software-License-1.0
  license_file: LICENSE
