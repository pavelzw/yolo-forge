[workspace]
name = "yolo-forge"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-arm64"]

[dependencies]
rattler-build = ">=0.37.0"
# lint
check-jsonschema = "*"
shellcheck = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
# autoupdate
python = "3.13.*"
pyyaml = "*"

[tasks]
build = "rattler-build build -c conda-forge -c https://prefix.dev/yolo-forge --recipe "
pre-commit-install = "pre-commit install"
lint = "pre-commit run -a"
autoupdate = "python scripts/autoupdate.py"
