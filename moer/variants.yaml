# conda-forge stdlib pinnings (this repo does not ship the conda-forge
# pinning feedstock, so define the minimum needed to render stdlib('c')).
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx
    then: "11.0"
