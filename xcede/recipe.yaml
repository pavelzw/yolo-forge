context:
  version: 0.13.0

package:
  name: xcede
  version: ${{ version }}

source:
  - url: https://codeberg.org/luxmentis/xcede/archive/${{ version }}.tar.gz
    sha256: c797e1e97fbaf38b8f6c369dc4d6b171f96bee38582090e9ff513e568f6fe329
  - url: https://codeberg.org/luxmentis/xcede/raw/tag/${{ version }}/LICENCE.txt
    sha256: 09e64454d10710ae2ac7db3cbabd50aa4130392abf7b353a61e88c3425aa6673

build:
  number: 0
  skip: target_platform != 'osx-arm64'
  script:
    - swift build -c release --arch arm64
    - mkdir -p $PREFIX/bin
    - cp .build/arm64-apple-macosx/release/xcede $PREFIX/bin/xcede

tests:
  - package_contents:
      bin:
        - xcede
      strict: true
  - script: xcede --help

about:
  summary: Build, run and debug Xcode projects outside Xcode
  homepage: https://codeberg.org/luxmentis/xcede
  repository: https://codeberg.org/luxmentis/xcede
  license: GPL-3.0-or-later
  documentation: https://codeberg.org/luxmentis/xcede
  license_file: LICENCE.txt
