name: Build all packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: true
      matrix:
        os:
          # linux-64
          - ubuntu-latest
          # linux-aarch64
          - ubuntu-24.04-arm
          # osx-arm64
          - macos-latest
          # win-64
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    # https://github.com/conda-forge/conda-forge.github.io/issues/2550
    # Swift is not available on conda-forge, so Swift recipes use the toolchain
    # bundled with the runner's Xcode. Don't install a swift.org toolchain via
    # swift-actions/setup-swift: v2 tops out at Swift 6.2, whose stdlib gates
    # `Span.bytes` behind macOS 26 (breaks swift-subprocess >= 1.0), and v3
    # switched to swiftly, whose `swift` shim fails inside rattler-build's
    # sanitized build-script env ("Could not load swiftly's configuration file").
    - run: swift --version
      if: matrix.os == 'macos-latest'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        activate-environment: true
    - name: Build packages
      shell: bash
      run: |
        echo "# ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
        rattler-build build --recipe-dir . --skip-existing=all \
            -c https://prefix.dev/yolo-forge -c conda-forge

        # https://github.com/prefix-dev/rattler-build/issues/2112
        # Check if any packages were built
        if [ ! -d "./output" ] || [ -z "$(find ./output -type f -name "*.conda" 2>/dev/null)" ]; then
          echo "❌ no package was built, did you increment the recipe version?" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${{ github.event_name }}" = "pull_request" ] && [ -s "$GITHUB_STEP_SUMMARY" ]; then
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$GITHUB_STEP_SUMMARY"
        fi
      env:
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
        RATTLER_BUILD_COLOR: always
        GH_TOKEN: ${{ github.token }}
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: output/**/*.conda
        name: output-${{ matrix.os }}

  upload:
    needs: build
    if: github.event_name == 'push'  # do not upload on PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for trusted publishing and attestations
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        activate-environment: true
    - name: Download packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: output-*
        path: output
        merge-multiple: true
    - name: Upload packages
      shell: bash
      run: |
        shopt -s nullglob
        files=(output/*/*.conda)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no packages to upload"
          exit 0
        fi
        rattler-build publish --to https://prefix.dev/yolo-forge --generate-attestation "${files[@]}"
