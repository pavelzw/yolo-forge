name: Build all packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os:
          # linux-64
          - ubuntu-latest
          # linux-aarch64
          - ubuntu-24.04-arm
          # osx-arm64
          - macos-latest
          # win-64
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    # https://github.com/conda-forge/conda-forge.github.io/issues/2550
    - name: Install Swift
      if: matrix.os == 'macos-latest'
      uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
      with:
        swift-version: 6.2
    - run: swift --version
      if: matrix.os == 'macos-latest'
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
      with:
        activate-environment: true
    - name: Build packages
      shell: bash
      run: |
        echo "# ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
        rattler-build build --recipe-dir . --skip-existing=all \
            -c https://prefix.dev/yolo-forge -c conda-forge

        # https://github.com/prefix-dev/rattler-build/issues/2112
        # Check if any packages were built
        if [ ! -d "./output" ] || [ -z "$(find ./output -type f -name "*.conda" 2>/dev/null)" ]; then
          echo "❌ no package was built, did you increment the recipe version?" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${{ github.event_name }}" = "pull_request" ] && [ -s "$GITHUB_STEP_SUMMARY" ]; then
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$GITHUB_STEP_SUMMARY"
        fi
      env:
        RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
        RATTLER_BUILD_COLOR: always
        GH_TOKEN: ${{ github.token }}
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: output/**/*.conda
        name: output-${{ matrix.os }}
    - name: Get JWT
      id: get_token
      if: github.event_name == 'push'  # do not upload on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const token = await core.getIDToken('prefix.dev')
          core.setOutput('token', token)
    - name: Mint the API Key on prefix.dev
      shell: bash
      if: github.event_name == 'push'  # do not upload on PR
      run: |
        TOKEN="${{ steps.get_token.outputs.token }}"
        RESPONSE="$(curl -s -X POST                 \
             https://prefix.dev/api/oidc/mint_token \
             -H 'Content-Type: application/json'    \
             --data "{\"token\": \"$TOKEN\"}")"
        # mask the response
        echo "::add-mask::$RESPONSE"
        echo "PREFIX_API_KEY=$RESPONSE" >> "$GITHUB_ENV"
    - name: Upload all packages
      shell: bash
      if: github.event_name == 'push'  # do not upload on PR
      run: |
        shopt -s nullglob
        EXIT_CODE=0
        for file in output/**/*.conda; do
          if ! rattler-build upload prefix -c yolo-forge "$file"; then
            EXIT_CODE=1
          fi
        done
        exit $EXIT_CODE
